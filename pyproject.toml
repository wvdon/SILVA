[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silva"
version = "1.0.0"
description = "SILVA: disentangled additive negative-binomial model for single-cell RNA-seq with per-gene factor attribution"
readme = "README.md"
license = {text = "GPL-3.0-only"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy",
  "scipy",
  "pandas",
  "anndata>=0.10",
  "scikit-learn",
]

[project.optional-dependencies]
benchmarks = ["scanpy>=1.10", "scib-metrics>=0.5", "scvi-tools>=1.1", "harmonypy", "scikit-misc", "leidenalg", "igraph"]

[tool.setuptools.packages.find]
include = ["silva*"]

[tool.setuptools.package-data]
silva = ["_skeleton/LICENSE"]
